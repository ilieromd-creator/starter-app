<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow Pro - Frontend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        background: #090d16;
        color: #f8fafc;
        padding: 2rem;
        margin: 0;
      }
      .card {
        max-width: 800px;
        margin: 0 auto;
        background: #111827;
        border: 1px solid #1f293d;
        border-radius: 12px;
        padding: 1.75rem;
      }
      h1 { margin-top: 0; color: #38bdf8; }
      .input-group { display: flex; gap: 0.5rem; margin: 1.25rem 0; }
      input, select {
        padding: 0.65rem 0.85rem;
        border-radius: 8px;
        border: 1px solid #1f293d;
        background: #0b1120;
        color: white;
      }
      input { flex: 1; }
      button {
        padding: 0.65rem 1.2rem;
        border-radius: 8px;
        border: none;
        background: #38bdf8;
        color: #090d16;
        font-weight: 600;
        cursor: pointer;
      }
      ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem; }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.85rem 1rem;
        background: #162032;
        border-radius: 8px;
        border: 1px solid #1f293d;
      }
      .done { text-decoration: line-through; color: #94a3b8; }
      .tag { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: #1e293b; color: #38bdf8; margin-left: 0.5rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Todo App - Frontend View</h1>
      <form id="addForm" class="input-group">
        <input id="todoInput" placeholder="Add a new task..." required />
        <select id="todoCat">
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Projects">Projects</option>
        </select>
        <button type="submit">Add Task</button>
      </form>
      <ul id="todoList"></ul>
    </div>

    <script>
      let token = localStorage.getItem('token') || '';

      const login = async () => {
        if (token) return token;
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'admin', password: 'secret' })
        });
        const data = await res.json();
        token = data.token;
        localStorage.setItem('token', token);
        return token;
      };

      const render = async () => {
        const authToken = await login();
        const res = await fetch('/items', {
          headers: { Authorization: 'Bearer ' + authToken }
        });
        const items = await res.json();
        const list = document.getElementById('todoList');
        list.innerHTML = '';

        (items || []).forEach((item) => {
          const li = document.createElement('li');
          const left = document.createElement('div');
          const span = document.createElement('span');
          span.textContent = item.name;
          if (item.done) span.className = 'done';
          left.appendChild(span);

          if (item.category) {
            const cat = document.createElement('span');
            cat.className = 'tag';
            cat.textContent = item.category;
            left.appendChild(cat);
          }

          const btn = document.createElement('button');
          btn.style.padding = '0.35rem 0.75rem';
          btn.style.fontSize = '0.8rem';
          btn.textContent = item.done ? 'Undo' : 'Done';
          btn.onclick = async () => {
            await fetch('/items/' + item.id, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + authToken },
              body: JSON.stringify({ done: !item.done })
            });
            render();
          };

          li.appendChild(left);
          li.appendChild(btn);
          list.appendChild(li);
        });
      };

      document.getElementById('addForm').onsubmit = async (e) => {
        e.preventDefault();
        const val = document.getElementById('todoInput').value.trim();
        const cat = document.getElementById('todoCat').value;
        if (!val) return;
        const authToken = await login();
        await fetch('/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + authToken },
          body: JSON.stringify({ name: val, category: cat, done: false })
        });
        document.getElementById('todoInput').value = '';
        render();
      };

      render();
    </script>
  </body>
</html>
